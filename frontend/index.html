<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HostelDekho</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="HostelDekho home">
      <span class="brand-mark">HD</span>
      <span>HostelDekho</span>
    </a>
    <nav class="main-nav" aria-label="Primary navigation">
      <a href="#search">Search</a>
      <a href="#detail">Stays</a>
      <a href="#owner">List property</a>
      <a href="#user">My trips</a>
    </nav>
    <div class="top-actions">
      <div id="auth-actions">
        <button class="ghost-button" type="button" data-open-auth>Login</button>
      </div>
      <a class="gradient-button small" href="#booking">Book stay</a>
    </div>
  </header>

  <main id="app"></main>

  <div class="auth-shell" id="authModal" aria-hidden="true">
    <section class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="icon-button close-auth" type="button" aria-label="Close login">x</button>
      <div class="auth-art" aria-hidden="true">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80" alt="">
      </div>
      <div class="auth-content">
        <p class="eyebrow">Welcome back</p>
        <h2 id="authTitle">Move in with confidence</h2>
        <p>Save homes, unlock owner contact, and complete bookings faster.</p>
        <button class="oauth-button" type="button">
          <span class="google-dot"></span>
          Continue with Google
        </button>
        <div class="divider"><span>or</span></div>
        <div id="standardLogin">
          <label class="field-label" for="mobile">Mobile number</label>
          <div class="otp-row">
            <input id="mobile" type="tel" placeholder="+91 98765 43210">
            <button class="gradient-button" id="sendOtpBtn" type="button">Send OTP</button>
          </div>
          <p class="microcopy">New around here? Login or Sign up via Mobile OTP.</p>
          <div class="divider"><span>or</span></div>
          <button class="ghost-button wide" onclick="toggleAdminLogin(true)">Secure Admin/Owner Login</button>
        </div>

        <div id="adminLogin" class="hidden">
           <label class="field-label">Email address</label>
           <input id="adminEmail" type="email" placeholder="Enter your email" class="wide-input">
           <label class="field-label mt-2">Password</label>
           <input id="adminPassword" type="password" placeholder="••••••••" class="wide-input">
           <button class="gradient-button wide mt-3" onclick="handleAdminLogin()">Secure Sign In</button>
           <button class="ghost-button wide mt-1" onclick="toggleAdminLogin(false)">Back to OTP Login</button>
        </div>
      </div>
    </section>
  </div>

  <div class="auth-shell" id="adminDetailModal" aria-hidden="true">
    <section class="auth-modal admin-wide-modal" role="dialog" aria-modal="true">
      <button class="icon-button close-modal" type="button" onclick="closeAdminModal()">x</button>
      <div id="adminModalContent" class="admin-modal-content">
        <!-- Injected via JS -->
      </div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
